spring:
  application:
    name: rmgflow
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    deserialization:
      # Jackson 3 (Spring Boot 4) flipped this default to true, so a request record with a
      # primitive component (OrderRequest.overrideFactoryApproval, contact `primary`, the
      # production quantities...) rejected any client that simply omitted the field with
      # "Failed to read request". Omitted primitives now take their Java default again.
      fail-on-null-for-primitives: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

---
# Non-test datasource connection. Omitted entirely under the 'test' profile so that
# Testcontainers' @ServiceConnection (Doc 16.2) can supply connection details instead —
# Spring Boot only defers to @ServiceConnection when no spring.datasource.* is explicitly set.
spring:
  config:
    activate:
      on-profile: '!test'
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rmgflow}
    username: ${DB_USERNAME:rmgflow}
    password: ${DB_PASSWORD:rmgflow}

---
server:
  port: ${SERVER_PORT:8080}

rmgflow:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-every-environment-minimum-256-bits-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  storage:
    # Document 17.2/ADR-06: production should point this at an S3-compatible bucket
    # mount or swap StorageService's implementation for a real S3 client — this local
    # filesystem implementation is a deliberately simple placeholder so Phase 3 has a
    # working attachment module without standing up MinIO/S3 in every dev environment.
    root-directory: ${STORAGE_ROOT:./data/attachments}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:26214400}
    download-token-ttl-minutes: ${STORAGE_DOWNLOAD_TTL_MIN:5}
  demo-data:
    # Opt-in demo dataset (config/DemoDataSeeder): 12 role logins + data on every
    # screen/report. Development/UAT only — never set DEMO_DATA=true in production.
    enabled: ${DEMO_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
